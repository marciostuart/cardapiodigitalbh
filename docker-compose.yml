services:
  app:
    build: .
    image: cardapiodigitalbh:${CARDAPIO_IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    networks: [360Network, internal]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
  web:
    build:
      context: .
      target: web
    image: cardapiodigitalbh-web:${CARDAPIO_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [app]
    networks: [360Network, internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=360Network
        - traefik.http.routers.cardapio.rule=Host(`cardapiodigitalbh.com.br`) || HostRegexp(`{subdomain:[a-z0-9-]+}.cardapiodigitalbh.com.br`)
        - traefik.http.routers.cardapio.entrypoints=websecure
        - traefik.http.routers.cardapio.tls=true
        - traefik.http.routers.cardapio.tls.certresolver=letsencryptresolver
        - traefik.http.routers.cardapio.tls.domains[0].main=cardapiodigitalbh.com.br
        - traefik.http.services.cardapio.loadbalancer.server.port=8080
  worker:
    build: .
    image: cardapiodigitalbh:${CARDAPIO_IMAGE_TAG:-latest}
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    env_file: .env
    restart: unless-stopped
    networks: [360Network, internal]
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
networks:
  360Network:
    external: true
    name: 360Network
  internal: {}
